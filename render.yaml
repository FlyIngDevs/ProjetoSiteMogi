databases:
  - name: shoppinghub-db
    databaseName: shoppinghub
    user: shoppinghub

services:
  - type: web
    name: shoppinghub
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -c "from app.database.database import Base, engine; Base.metadata.create_all(bind=engine); print('Database tables created successfully')"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: shoppinghub-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shoppinghub-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: WEB_CONCURRENCY
        value: "1"
