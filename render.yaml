# Render deployment configuration
# v2.0 - 2026-03-29 - Force rebuild with diagnostic validation
databases:
  - name: shoppinghub-db
    databaseName: shoppinghub
    user: shoppinghub

services:
  - type: web
    name: shoppinghub
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python diagnose.py
    startCommand: python run.py
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: shoppinghub-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: '3.12'
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: PYTHONDONTWRITEBYTECODE
        value: '1'
      - key: DEBUG
        value: 'false'
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: '480'
      - key: DATABASE_URL
        fromDatabase:
          name: shoppinghub-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: WEB_CONCURRENCY
        value: '1'
