# Render deployment configuration for Shopping Platform
# This is an alternative configuration that avoids shell script issues
# Use this if the main render.yaml fails

databases:
  - name: shoppinghub-db
    databaseName: shoppinghub
    user: shoppinghub

services:
  - type: web
    name: shoppinghub
    env: python
    rootDir: backend
    buildCommand: >
      pip install -r requirements.txt &&
      python -c "
import sys;
sys.path.insert(0, '.');
print('Checking project structure...');
from pathlib import Path;
assert Path('main.py').exists(), 'main.py not found';
assert Path('app').exists(), 'app folder not found';
print('✓ Structure OK');
print('Importing application...');
from main import app;
print('✓ Application imported');
print('Creating database tables...');
from app.database.database import Base, engine;
Base.metadata.create_all(bind=engine);
print('✓ Database tables created');
print('Build completed successfully!')
      "
    startCommand: python run.py
    autoDeploy: true
    healthCheckPath: /health
    disk:
      name: shoppinghub-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: '3.12'
      - key: PYTHONUNBUFFERED
        value: '1'
      - key: PYTHONDONTWRITEBYTECODE
        value: '1'
      - key: DEBUG
        value: 'false'
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: shoppinghub-db
          property: connectionString
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: WEB_CONCURRENCY
        value: '1'
