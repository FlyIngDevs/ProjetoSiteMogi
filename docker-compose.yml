version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: shopping_db
    environment:
      POSTGRES_USER: shopping_user
      POSTGRES_PASSWORD: shopping_password
      POSTGRES_DB: shopping_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: shopping_backend
    environment:
      DATABASE_URL: postgresql://shopping_user:shopping_password@postgres/shopping_db
      SECRET_KEY: your-secret-key-change-in-production
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    image: node:18
    container_name: shopping_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "8080:8080"
    command: npx http-server -p 8080

volumes:
  postgres_data:
